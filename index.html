<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ሃበሻ ቢንጎ ጨዋታ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #fff; text-align: center; margin: 0; padding: 15px; }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        p { color: #94a3b8; }
        .card-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 360px; margin: 20px auto; background: #1e293b; padding: 10px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .cell { background: #334155; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 60px; font-size: 20px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; user-select: none; }
        .cell.marked { background: #22c55e; color: #fff; transform: scale(0.95); }
        .cell.free { background: #f59e0b; color: #000; font-size: 16px; }
        .btn { background: #38bdf8; color: #0f172a; border: none; padding: 14px 30px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 15px; width: 100%; max-width: 360px; box-shadow: 0 4px 10px rgba(56, 189, 248, 0.3); }
        .btn:hover { background: #0ea5e9; }
    </style>
</head>
<body>

    <h1>🎯 ሃበሻ ቢንጎ</h1>
    <p>ቁጥሮችን እየነኩ (Click እያደረጉ) ምልክት ያድርጉ!</p>

    <div class="card-container" id="bingoCard">
        <!-- በጃቫስክሪፕት በኩል ይሞላል -->
    </div>

    <button class="btn" onclick="declareBingo()">🔥 ቢንጎ! (Bingo)</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function generateCard() {
            const container = document.getElementById('bingoCard');
            container.innerHTML = '';
            
            // ለናሙና የሚሆን የ 25 ካርዶች ሰንጠረዥ (በኋላ ከባክኤንድ ጋር ይያያዛል)
            for (let i = 0; i < 25; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                
                if (i === 12) {
                    cell.innerText = 'FREE';
                    cell.classList.add('free', 'marked');
                } else {
                    cell.innerText = Math.floor(Math.random() * 75) + 1;
                    cell.onclick = function() {
                        this.classList.toggle('marked');
                    };
                }
                container.appendChild(cell);
            }
        }

        function declareBingo() {
            tg.sendData("BINGO_WINNER");
            tg.close();
        }

        generateCard();
    </script>
</body>
</html>
