<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habesha Bingo Mini App</title>
    <style>
        body {
            background-color: #17212b;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        .header {
            background-color: #242f3d;
            padding: 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 15px;
        }
        .badge {
            background: #2b5278;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 14px;
        }
        .ball-display {
            background: #ffc107;
            color: #000;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            margin: 15px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        table {
            margin: 0 auto;
            border-collapse: collapse;
            background: #242f3d;
            border-radius: 10px;
            overflow: hidden;
        }
        th, td {
            width: 50px;
            height: 50px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid #17212b;
            cursor: pointer;
        }
        th {
            background: #2b5278;
            color: #fff;
        }
        td {
            background: #ffffff;
            color: #000;
            transition: 0.2s;
        }
        td.selected {
            background: #4caf50 !important;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="badge">BALANCE: <span id="balance">1640</span> ETB</div>
        <div class="badge">PLAYERS: 205</div>
    </div>

    <h3>Habesha Bingo</h3>

    <div class="ball-display" id="currentBall">N-40</div>

    <table>
        <tr>
            <th>B</th><th>I</th><th>N</th><th>G</th><th>O</th>
        </tr>
        <tr>
            <td onclick="toggleCell(this)">1</td>
            <td onclick="toggleCell(this)">18</td>
            <td onclick="toggleCell(this)">33</td>
            <td onclick="toggleCell(this)">48</td>
            <td onclick="toggleCell(this)">63</td>
        </tr>
        <tr>
            <td onclick="toggleCell(this)">5</td>
            <td onclick="toggleCell(this)">20</td>
            <td onclick="toggleCell(this)">35</td>
            <td onclick="toggleCell(this)">50</td>
            <td onclick="toggleCell(this)">65</td>
        </tr>
        <tr>
            <td onclick="toggleCell(this)">9</td>
            <td onclick="toggleCell(this)">24</td>
            <td onclick="toggleCell(this)">39</td>
            <td onclick="toggleCell(this)">54</td>
            <td onclick="toggleCell(this)">69</td>
        </tr>
        <tr>
            <td onclick="toggleCell(this)">12</td>
            <td onclick="toggleCell(this)">27</td>
            <td onclick="toggleCell(this)">42</td>
            <td onclick="toggleCell(this)">57</td>
            <td onclick="toggleCell(this)">72</td>
        </tr>
        <tr>
            <td onclick="toggleCell(this)">15</td>
            <td onclick="toggleCell(this)">30</td>
            <td onclick="toggleCell(this)">45</td>
            <td onclick="toggleCell(this)">60</td>
            <td onclick="toggleCell(this)">75</td>
        </tr>
    </table>

    <script>
        function toggleCell(cell) {
            cell.classList.toggle('selected');
        }
    </script>

</body>
</html>
